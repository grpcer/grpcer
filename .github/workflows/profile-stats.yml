name: generate profile stats (incl. private repos)

on:
  # 每天 03:10 CST(北京时间) == 19:10 UTC 前一天自动重画
  schedule:
    - cron: "10 19 * * *"
  # 允许在 Actions 页面手动触发（首次上线用得到）
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-profile-stats
    steps:
      - uses: actions/checkout@v5
      - name: aggregate activity & languages, render SVG
        env:
          LANG_STATS_PAT: ${{ secrets.LANG_STATS_PAT }}
          # 组织按有效期拒绝 PAT 时，用内置 token 读组织公开仓的 star
          PUBLIC_READ_TOKEN: ${{ github.token }}
        run: python3 scripts/gen_profile_stats.py
      - name: commit & push
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          # hero.svg 是手写的，脚本不生成它，所以不在这里 add
          # hero.svg 是手写的、脚本不生成，所以不在 add 范围内
          git add -A assets/card-*.svg assets/stats-*.svg assets/activity-*.svg
          if git commit -m "chore: 自动生成主页统计图"; then
            git push
          fi
